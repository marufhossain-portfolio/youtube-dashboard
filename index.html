<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Islamic Pause — YouTube Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23ff0000'/%3E%3Ctext x='50' y='68' font-size='52' font-weight='bold' font-family='Arial' text-anchor='middle' fill='white'%3EYT%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">YT</span>
        <div class="brand-text">
          <h1>YouTube Dashboard</h1>
          <p id="channelHandle">Loading…</p>
        </div>
      </div>
      <div class="topbar-right">
        <span class="live-dot"><span class="dot"></span> Live</span>
        <button id="refreshBtn" class="refresh-btn" title="Refresh data">
          <span class="refresh-icon" id="refreshIcon">↻</span> Refresh
        </button>
      </div>
    </div>
  </header>

  <section class="channel-banner" id="channelBanner">
    <div class="banner-inner">
      <img id="channelAvatar" class="channel-avatar" alt="channel avatar" />
      <div class="channel-info">
        <h1 id="channelName">Loading…</h1>
        <p id="channelDesc" class="channel-desc"></p>
        <div class="channel-meta" id="channelMeta"></div>
      </div>
    </div>
  </section>

  <section class="stats-row" id="statsRow">
    <div class="stat-card"><div class="stat-value" id="statSubs">—</div><div class="stat-label">Subscribers</div></div>
    <div class="stat-card"><div class="stat-value" id="statViews">—</div><div class="stat-label">Total Views</div></div>
    <div class="stat-card"><div class="stat-value" id="statVideos">—</div><div class="stat-label">Videos</div></div>
    <div class="stat-card"><div class="stat-value" id="statLikes">—</div><div class="stat-label">Total Likes</div></div>
  </section>

  <section class="controls">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"/></svg>
      <input id="searchInput" type="text" placeholder="Search videos…" autocomplete="off" spellcheck="false" />
    </div>
    <select id="sortSelect" class="sort-select">
      <option value="date">Newest first</option>
      <option value="views">Most viewed</option>
      <option value="likes">Most liked</option>
      <option value="comments">Most commented</option>
    </select>
  </section>

  <div class="result-count" id="resultCount"></div>

  <main class="video-grid" id="videoGrid">
    <div class="loading" id="loading">Loading videos…</div>
  </main>

  <footer class="footer">
    <span id="footerInfo">Data via YouTube Data API</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
